<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Atelier Reconnecting | Meltix</title>
    <style>
        :root { --ink: #080604; --gold: #dcae6f; --cream: #f8efe3; --muted: #c3b0a0; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            color: var(--cream);
            background:
                radial-gradient(circle at 50% 44%, rgba(157, 103, 49, 0.25), transparent 30rem),
                radial-gradient(circle at 16% 10%, rgba(219, 174, 111, 0.08), transparent 22rem),
                var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
        }
        .error-page {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 1.5rem;
            position: relative;
        }
        .error-page::before {
            content: '';
            position: absolute;
            inset: 1rem;
            pointer-events: none;
            border: 1px solid rgba(220, 174, 111, 0.12);
            border-radius: 1.5rem;
        }
        .error-card {
            width: min(100%, 31rem);
            padding: clamp(1.5rem, 4vw, 2.5rem);
            position: relative;
            text-align: center;
            border: 1px solid rgba(220, 174, 111, 0.28);
            border-radius: 1.5rem;
            background: linear-gradient(145deg, rgba(37, 24, 16, 0.94), rgba(12, 8, 5, 0.97));
            box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 235, 203, 0.06);
        }
        .error-code {
            display: block;
            color: var(--gold);
            font-family: Arial, sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }
        .error-bot {
            width: min(100%, 13rem);
            height: auto;
            display: block;
            margin: 0.75rem auto 0.2rem;
            filter: drop-shadow(0 1rem 1.25rem rgba(0, 0, 0, 0.42));
        }
        h1 {
            margin: 0.15rem 0 0;
            font-size: clamp(1.65rem, 6vw, 2.35rem);
            font-weight: 500;
            line-height: 1.05;
        }
        p {
            max-width: 28rem;
            margin: 0.8rem auto 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .error-action {
            min-height: 2.8rem;
            padding: 0.75rem 1.15rem;
            border: 1px solid rgba(220, 174, 111, 0.42);
            border-radius: 999px;
            color: var(--cream);
            background: transparent;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform 160ms ease, background 160ms ease;
        }
        .error-action:hover, .error-action:focus-visible {
            transform: translateY(-2px);
            background: rgba(220, 174, 111, 0.14);
        }
        .error-action--primary { color: #16100a; background: var(--gold); }
        .error-action--primary:hover, .error-action--primary:focus-visible { background: #efc382; }
        @media (max-width: 480px) {
            .error-page { padding: 1rem; }
            .error-page::before { inset: 0.55rem; border-radius: 1rem; }
            .error-card { border-radius: 1.1rem; }
            .error-bot { width: min(100%, 10.5rem); }
            .error-actions { flex-direction: column; }
            .error-action { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <section class="error-card" aria-labelledby="error-title">
            <span class="error-code">Atelier status {{ status_code }}</span>
            <img class="error-bot" src="{{ url_for('static', filename='images/error_page_clean.png') }}" alt="Meltix bot untangling a connection">
            <h1 id="error-title">{{ title }}</h1>
            <p>{{ message }}</p>
            <div class="error-actions">
                <button class="error-action error-action--primary" type="button" onclick="window.location.reload()">Try again</button>
                <a class="error-action" href="{{ url_for('shop') }}">Back to Shop</a>
            </div>
        </section>
    </main>
</body>
</html>
